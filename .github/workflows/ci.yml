name: CI Build

on:
  push:
    branches: [kiro-develop, main]
  pull_request:
    branches: [kiro-develop, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: npm

      - run: npm install --legacy-peer-deps

      - run: npm run build
